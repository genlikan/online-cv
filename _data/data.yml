career-profile:
    title: Career Profile
    summary: |
      Founding Forward Deployed AI Engineer at StackAI, an enterprise platform for building agentic AI workflows.
      I now lead the Forward Deployed Engineering team while still shipping at individual-contributor pace, and I own the
      platform's integrations catalog end to end. Full-stack across Python/FastAPI, Temporal, PostgreSQL, Next.js/React and
      AWS, with deep production experience in LLM provider integration and agent orchestration.

experiences:
    - role: Founding Forward Deployed AI Engineer
      time: "May 2025 - Present"
      company: StackAI · now FDE Team Lead & Integrations Lead
      details: |
        - First forward deployed engineer; grew the function into a 10-person team that I lead
        - Ship alongside the team: 100+ merged PRs across 50 integration and platform areas in the first half of 2026
        - Own the integrations catalog (165+ connectors): connector architecture, auth conventions, error-mapping standards, safe input validation and a live-test bar for every integration
        - Scaled integration development with multi-agent build tooling; led a refactor that brought 199 actions to the gold standard with 635 tests
        - Run recurring LLM provider audits across Anthropic, OpenAI, AWS Bedrock and others: live API checks, end-to-end runs and pricing verification
        - Production engineering: fixed a database connection leak in the FastAPI backend, retired legacy unauthenticated endpoints, supported the move to AWS EKS
        - Lead the Canvas LMS (LTI) integration and customer-facing engineering for enterprise accounts
        - Cut backend CI time roughly in half (median 19 to 9 minutes across ~16,500 tests), measured over 300+ runs
        - Built a weekly harness that tests every model in the LLM catalog through the platform, catching failures before customers do
        - Redesigned a customer's AI search workflow through controlled experiments: ~25x fewer tokens and ~5x faster, with no quality loss in a blind evaluation
        - Reliability and security fixes: a circuit breaker for failing triggers, atomic memory saves for concurrent runs, SSRF-safe downloads and blocking unsafe SQL functions
        - Designed the FDE hiring rubric and an automated technical evaluation pipeline

    - role: AI/ML Engineer
      time: Nov 2024 - Jun 2025
      company: MIT Sloan School of Management · Contract

    - role: Information Technology Consultant
      time: Jan 2022 - Dec 2024
      company: Harvard Medical School · Contract

    - role: IT Platform Specialist
      time: Jan 2021 - Jan 2023
      company: MIT Sloan School of Management · Contract

    - role: COVID-19 Emergency Response Coordinator
      time: Sep 2020 - Nov 2020
      company: MIT Sloan School of Management · Contract
      details: |
        - Joined for temporary data-entry work, automated months of it in about two hours, and was brought on for the platform role that followed

